<div class="page-container">
  <div class="page-header">
    <div class="page-header-icon">
      <svg lucideTruck [size]="28"></svg>
    </div>
    <div>
      <h1 class="page-title">Assigned Pickups</h1>
      <p class="page-subtitle">Manage and track your assigned waste pickups</p>
    </div>
  </div>

  <div class="coming-soon-card">
    <div class="coming-soon-icon">
      <svg lucideTruck [size]="48"></svg>
    </div>
    <h2>Coming Soon</h2>
    <p>View your assigned pickups, navigate to locations, and mark completions.</p>
    <div class="feature-chips">
      <span class="chip">
        <svg lucideMapPin [size]="14"></svg>
        Route Navigation
      </span>
      <span class="chip">
        <svg lucideClock [size]="14"></svg>
        Schedule View
      </span>
      <span class="chip">
        <svg lucideCheckCircle [size]="14"></svg>
        Status Tracking
      </span>
    </div>
  </div>
</div>
