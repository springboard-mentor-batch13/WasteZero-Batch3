<div class="page-container">
  <div class="page-header">
    <div class="page-header-icon">
      <svg lucideCalendarPlus [size]="28"></svg>
    </div>
    <div>
      <h1 class="page-title">Schedule Pickup</h1>
      <p class="page-subtitle">Request a waste pickup from nearby volunteers</p>
    </div>
  </div>

  <div class="coming-soon-card">
    <div class="coming-soon-icon">
      <svg lucideCalendarPlus [size]="48"></svg>
    </div>
    <h2>Coming Soon</h2>
    <p>Schedule waste pickups, set preferred times, and track your requests in real-time.</p>
    <div class="feature-chips">
      <span class="chip">
        <svg lucideMapPin [size]="14"></svg>
        Location Tracking
      </span>
      <span class="chip">
        <svg lucideClock [size]="14"></svg>
        Flexible Scheduling
      </span>
      <span class="chip">
        <svg lucidePackage [size]="14"></svg>
        Waste Categories
      </span>
    </div>
  </div>
</div>
