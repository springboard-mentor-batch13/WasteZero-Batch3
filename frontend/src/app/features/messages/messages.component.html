<div class="page-container">
  <div class="page-header">
    <div class="page-header-icon">
      <svg lucideMessageSquare [size]="28"></svg>
    </div>
    <div>
      <h1 class="page-title">Messages</h1>
      <p class="page-subtitle">Connect with volunteers and community members</p>
    </div>
  </div>

  <div class="coming-soon-card">
    <div class="coming-soon-icon">
      <svg lucideMessageSquare [size]="48"></svg>
    </div>
    <h2>Coming Soon</h2>
    <p>Chat with other volunteers, coordinate pickups, and build your waste-reduction community.</p>
    <div class="feature-chips">
      <span class="chip">
        <svg lucideSearch [size]="14"></svg>
        Search Conversations
      </span>
      <span class="chip">
        <svg lucideSend [size]="14"></svg>
        Direct Messages
      </span>
      <span class="chip">
        <svg lucideUsers [size]="14"></svg>
        Group Chats
      </span>
    </div>
  </div>
</div>
