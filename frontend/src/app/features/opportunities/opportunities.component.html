<div class="page-container">
  <div class="page-header">
    <div class="page-header-icon">
      <svg lucideHeart [size]="28"></svg>
    </div>
    <div>
      <h1 class="page-title">Volunteer Opportunities</h1>
      <p class="page-subtitle">Discover ways to contribute to your community</p>
    </div>
  </div>

  <div class="coming-soon-card">
    <div class="coming-soon-icon">
      <svg lucideHeart [size]="48"></svg>
    </div>
    <h2>Coming Soon</h2>
    <p>Browse volunteer events, join community cleanups, and make a positive environmental impact.</p>
    <div class="feature-chips">
      <span class="chip">
        <svg lucideUsers [size]="14"></svg>
        Community Events
      </span>
      <span class="chip">
        <svg lucideCalendar [size]="14"></svg>
        Event Calendar
      </span>
      <span class="chip">
        <svg lucideMapPin [size]="14"></svg>
        Nearby Activities
      </span>
    </div>
  </div>
</div>
