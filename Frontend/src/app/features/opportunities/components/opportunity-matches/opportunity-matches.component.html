<!-- opportunity-matches.component.html -->
<section class="opportunity-matches">
  <div *ngIf="loading" class="loading">Loading opportunities...</div>
  <div class="grid">
    <article *ngFor="let o of opportunities" class="card">
      <div class="card-header">
        <h4 class="title">{{ o.title }}</h4>
        <span class="badge">{{ asPercentage(o.matchScore) }}% Match</span>
      </div>
      <div class="meta">
        <div class="org">{{ o.organization }}</div>
        <div class="location" *ngIf="o.location">{{ o.location }}</div>
      </div>
      <div class="skills">
        <strong>Required skills:</strong>
        <span *ngIf="o.requiredSkills?.length; else none">
          <span class="skill" *ngFor="let s of o.requiredSkills">{{ s }}</span>
        </span>
        <ng-template #none>None listed</ng-template>
      </div>
    </article>
  </div>
  <div *ngIf="!loading && opportunities.length === 0" class="empty">No matches found</div>
</section>
