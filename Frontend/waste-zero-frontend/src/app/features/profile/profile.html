<div class="dashboard">

  <!-- Sidebar -->
  <aside class="sidebar">

    <div class="logo">
      <h2>♻ WasteZero</h2>
    </div>

    <ul class="menu">

      <li routerLink="/dashboard" routerLinkActive="active">
        Dashboard
      </li>

      <li routerLink="/profile" routerLinkActive="active">
        Profile
      </li>

      <li>
        Pickups
      </li>

      <li>
        Recycling
      </li>

      <li>
        Reports
      </li>

      <li routerLink="/change-password" routerLinkActive="active">
        Change Password
      </li>

      <li (click)="logout()">
        Logout
      </li>

    </ul>

  </aside>

  <!-- Main Content -->
  <main class="main-content">

    <div class="topbar">
      <h2>My Profile 👤</h2>
      <span>Manage your personal information</span>
    </div>

    <form [formGroup]="profileForm" (ngSubmit)="saveProfile()">

      <div class="form-group">

        <label>Full Name</label>

        <input
          type="text"
          formControlName="name"
          placeholder="Enter your full name"
        >

      </div>

      <div class="form-group">

        <label>Email</label>

        <input
          type="email"
          formControlName="email"
          readonly
        >

      </div>

      <div class="form-group">

        <label>Location</label>

        <input
          type="text"
          formControlName="location"
          placeholder="Enter your location"
        >

      </div>

      <div class="form-group">

        <label>Skills</label>

        <input
          type="text"
          formControlName="skills"
          placeholder="Angular, Node.js, MongoDB"
        >

        <small>
          Separate multiple skills using commas (,)
        </small>

      </div>

      <div class="form-group">

        <label>Bio</label>

        <textarea
          rows="5"
          formControlName="bio"
          placeholder="Tell us something about yourself..."
        ></textarea>

      </div>

      <button type="submit">
        Save Profile
      </button>

    </form>

  </main>

</div>
